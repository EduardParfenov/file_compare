name: CI

on:
  # Любая ветка: проверки должны запускаться там, где пишется код, а не
  # только там, куда он уже слит. Раньше ветка без pull request не
  # проверялась вовсе, и накопление непроверенных изменений оставалось
  # незамеченным до самого слияния.
  push:
    branches: ["**"]
  pull_request:

jobs:
  ci:
    # Образ закреплён явно: метка ubuntu-latest мигрирует на Ubuntu 26
    # (объявлено на 19 октября 2026), и смена образа не должна менять
    # результат проверок без участия разработчика.
    runs-on: ubuntu-24.04
    steps:
      # Actions закреплены на версиях, работающих на поддерживаемом рантайме
      # Node 24: Node 20 объявлен устаревшим, и v4/v5/v2 работали на нём.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Audit dependencies
        run: pip-audit -r requirements.txt -r requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Validate OpenSpec specs
        run: npx -y @fission-ai/openspec@1.12.0 validate --all --strict
