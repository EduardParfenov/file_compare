# Настройки линтера и форматтера зафиксированы в репозитории: без них
# проверки зависят от значений по умолчанию установленной версии ruff,
# которые меняются от релиза к релизу.
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle (предупреждения)
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    "BLE",  # flake8-blind-except: широкий except обязан быть обоснован
    "RUF",
    "S",    # bandit
]
ignore = [
    # Длину строк задаёт форматтер; дублирующая проверка линёра даёт
    # противоречивые сообщения о длинных строках, которые нельзя разбить
    # (ссылки, пояснения к noqa).
    "E501",
    # Кириллица в строках, комментариях и docstring — норма проекта.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# assert — язык тестов, а не проверка в коде приложения.
# E402: тесты подключают общий модуль фикстур через sys.path перед импортом;
# это осознанный порядок импортов.
"tests/*" = ["S101", "E402"]
