schema: spec-driven

# Project context (перенесено из project.md)
context: |
  # file_compare

  Веб-приложение для сравнения двух версий документов. Текущая поддержка: `.docx`.
  Планируется расширение на `.xlsx` и `.pdf`.

  ## Технологический стек

  - Python 3.11
  - Flask (фабрика приложений `create_app`)
  - python-dotenv — конфигурация через переменные окружения
  - langchain-openai — взаимодействие с LLM (OpenAI-совместимый API)
  - pytest — тестирование

  ## Структура проекта

      app/                пакет приложения
        __init__.py       фабрика create_app, конфигурация из env
        routes.py         HTTP-роуты (страницы + /api/*)
        services/         бизнес-логика: uploads, conversion (+docx_converter),
                          diffing, llm, jobs
        templates/        Jinja2-шаблоны
        static/           app.js, style.css (vanilla frontend)
      tests/              тесты pytest (LLM мокается, сеть не используется)
      openspec/           спецификации OpenSpec (specs/, changes/)
      uploads/            каталог загрузок (не коммитится, путь из UPLOAD_DIR)

  ## Конвенции

  - Конфигурация только через переменные окружения (см. `.env.example`),
  без хардкода секретов и абсолютных путей — проект docker-friendly.
  - `SECRET_KEY` зарезервирован на будущее (сессии/CSRF); в текущей
    реализации не используется.
  - Все пути в коде относительные либо берутся из конфигурации.
  - Загружаемые файлы сохраняются только в `UPLOAD_DIR`.
  - Список разрешённых расширений — через `ALLOWED_EXTENSIONS` (строка,
    значения через запятую, например `.docx,.xlsx,.pdf`).
  - Новая функциональность оформляется change-предложениями OpenSpec
    в `openspec/changes/`.
  - Перед коммитом прогонять `pytest`, `ruff format .` и `ruff check .`.
  - Язык кода и комментариев: английский идентификаторы, допустимы
    русские docstring/тексты UI.
  - Каталог `input/` — рабочие заметки и черновики, не часть проекта:
    читать и использовать эти файлы при работе над проектом запрещено.

  ## Правила безопасности

  - `.env` и реальные секреты никогда не коммитятся.
  - Ограничение размера загрузки — `MAX_CONTENT_LENGTH`.

rules:
  proposal:
    - "Каждое предложение изменения должно содержать строку «уровень: несовместимое поведение» или «уровень: исправление», и при архивации версия проекта повышается соответствующим полем (major или patch)."

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
operations:
  apply:
    guidance:
      - "Реализация MUST показывать пользователю каждое решение, принятое сверх или вопреки артефактам change'а (proposal, specs, design, tasks), ДО внесения изменений в артефакты и до продолжения работы: что обнаружено, какое решение принято, почему оно выбрано и что меняется в артефактах. Показ обязателен и тогда, когда новое решение технически вернее исходного, и тогда, когда оно проще."
      - "Артефакты change'а MUST NOT правиться молча. Правка proposal, design или требований допускается только после явного согласия; молчаливая правка считается нарушением независимо от того, была ли она верной. Решение, полностью следующее артефакту, показывать не нужно."
      - "Расширение объёма работ (новые файлы, новые точки кода, новые требования), которого нет в proposal и tasks, MUST быть вынесено пользователю отдельно, а не поглощено молча."
      - "Принятые при реализации решения записывать в design как отдельные решения с пометкой о том, что они внесены при реализации, и почему прежняя формулировка была неверной или неполной."
      - "В отчёте о завершении перечислять не только сделанное, но и незакрытое: отложенные места, оставшиеся подавления линтера, найденные, но не исправленные расхождения между кодом и требованиями."
  archive:
    guidance:
      - "Перед архивацией убедиться, что синхронизированные спеки соответствуют коду, а не только форме: расхождение кода и требования останавливает архивацию."
      - "Сообщить, какие решения были приняты в ходе реализации поверх исходных артефактов, чтобы правки артефактов не остались незамеченными."
